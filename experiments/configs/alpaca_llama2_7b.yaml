model: meta-llama/Llama-2-7b-hf
dtype: bfloat16
max_length: 512
batch_size: 1
eval_batch_size: 1
lora_rank: 16

flowra:
  budget: 0.0087
  eta: 0.3
  calibration_samples: 512
  modules_to_save: []

training:
  lr: 0.001
  weight_decay: 0.0
  lr_schedule: linear
  lr_warmup_ratio: 0.06
  grad_clip: 1.0
  log_every: 50
  max_steps: 5000

max_eval_new_tokens: 128
alpaca_eval_n: 805             # tatsu-lab/alpaca_eval
eval_model: gpt-4
seeds: [0, 1, 2]
methods: [full_ft, lora, dora, flowra]
